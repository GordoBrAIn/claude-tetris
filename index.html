<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="gameover-records" class="records hidden">
          <form id="name-form" class="hidden" autocomplete="off">
            <label for="name-input">¡Nuevo record! Tu nombre:</label>
            <input id="name-input" type="text" maxlength="12" />
            <button type="submit" class="rec-btn">Guardar</button>
          </form>
          <p class="label">RECORDS</p>
          <ol id="gameover-list" class="rec-list"></ol>
          <p id="gameover-stats" class="rec-stats"></p>
          <button type="button" class="rec-btn rec-reset reset-records-btn">Resetear records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box records">
        <p class="start-title">TETRIS</p>
        <p class="label">RECORDS</p>
        <ol id="start-records" class="rec-list"></ol>
        <p id="start-stats" class="rec-stats"></p>
        <button type="button" id="start-btn" class="rec-btn rec-primary">Empezar</button>
        <button type="button" class="rec-btn rec-reset reset-records-btn">Resetear records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="records.js"></script>
</body>
</html>
